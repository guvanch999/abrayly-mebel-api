        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exceptions.ResponseError'
      security:
      - Bearer: []
      summary: Update Product
  /products/{id}/attributes:
    post:
      consumes:
      - application/json
      description: Add an attribute to a product
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Attribute
        in: body
        name: attributeDto
        required: true
        schema:
          $ref: '#/definitions/dto.AttributeDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.MessageWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/exceptions.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exceptions.ResponseError'
      security:
      - Bearer: []
      summary: Add Attribute to Product
  /products/{id}/attributes/{attribute_id}:
    delete:
      consumes:
      - application/json
      description: Remove an attribute from a product
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Attribute ID
        in: path
        name: attribute_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.MessageWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/exceptions.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exceptions.ResponseError'
      security:
      - Bearer: []
      summary: Remove Attribute from Product
  /products/{id}/attributes/{attribute_id}/values:
    delete:
      consumes:
      - application/json
      description: Remove a value from an attribute
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Attribute ID
        in: path
        name: attribute_id
        required: true
        type: string
      - description: Remove Value
        in: body
        name: removeValueDto
        required: true
        schema:
          $ref: '#/definitions/dto.AttributeValueDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.MessageWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/exceptions.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exceptions.ResponseError'
      security:
      - Bearer: []
      summary: Remove Value from Attribute
    post:
      consumes:
      - application/json
      description: Add a value to an attribute
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Attribute ID
        in: path
        name: attribute_id
        required: true
        type: string
      - description: Add Value
        in: body
        name: addValueDto
        required: true
        schema:
          $ref: '#/definitions/dto.AttributeValueDto'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.MessageWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/exceptions.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exceptions.ResponseError'
      security:
      - Bearer: []
      summary: Add Value to Attribute
  /products/{id}/images:
    post:
      consumes:
      - multipart/form-data
      description: Add an image to a product
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Image
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.MessageWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/exceptions.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exceptions.ResponseError'
      security:
      - Bearer: []
      summary: Add Image to Product
  /products/{id}/images/{image_id}:
    delete:
      consumes:
      - application/json
      description: Remove an image from a product
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Image ID
        in: path
        name: image_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/util.MessageWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/exceptions.ResponseError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/exceptions.ResponseError'
      security:
      - Bearer: []
      summary: Remove Image from Product
securityDefinitions:
  Bearer:
    description: Bearer token is required to access the Abrayly API. If you don't
      have a token, please register in the system first
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
